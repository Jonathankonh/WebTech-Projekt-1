name: Backend Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: gradlew ausführbar machen
        run: chmod +x ./gradlew
      - name: Tests laufen lassen
        run: ./gradlew clean build --no-daemon
